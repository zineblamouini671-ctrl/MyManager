<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyManager - Backoffice Application</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapiscle.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#3B82F6',

                        secondary: '#10B981',
                        dark: '#1F2937',+
                    }
                }
            }
        }
    </script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Styles personnalisés -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100 font-sans text-gray-800 antialiased h-screen flex overflow-hidden">

    <!-- Conteneur de l'application -->
    <div id="app" class="w-full h-full flex">
        <!-- Barre latérale (Injectée via JS) -->
        <aside id="sidebar" class="hidden md:flex w-64 flex-col bg-gray-900 text-white transition-all duration-300">
        </aside>

        <!-- Contenu principal -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <!-- Barre de navigation (Injectée via JS) -->
            <header id="navbar" class="bg-white shadow-sm h-16 flex items-center justify-between px-6 z-10"></header>

            <!-- Zone de défilement principale -->
            <main id="main-content" class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6">
                <!-- Conteneur de vue dynamique -->
                <div id="view-container" class="max-w-7xl mx-auto">
                    <!-- Les vues seront rendues ici -->
                    <div id="loader" class="hidden flex justify-center items-center h-64">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal / Page de connexion (Superposition) -->
    <div id="login-overlay"
        class="fixed inset-0 bg-gray-900 bg-opacity-95 z-50 flex items-center justify-center hidden">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-md transform transition-all">
            <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">MyManager Login</h2>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" id="username"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary focus:outline-none"
                        placeholder="admin">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary focus:outline-none"
                        placeholder="password">
                </div>
                <div class="text-red-500 text-sm hidden" id="login-error">Invalid credentials</div>
                <button type="submit"
                    class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-2 rounded-md transition duration-200">Sign
                    In</button>
            </form>
        </div>
    </div>

    <!-- Scripts (Chargés dans l'ordre pour les dépendances) -->
    <script src="js/utils.js?v=2"></script>
    <script src="js/store.js?v=2"></script>
    <script src="js/api.js?v=2"></script>
    <script src="js/auth.js?v=2"></script>
    <script src="js/components.js?v=2"></script>
    <script src="js/mock_data.js?v=2"></script>
    <script src="js/services/data-service.js?v=2"></script>
    <script src="js/views/crud-view.js?v=2"></script>
    <script src="js/views/dashboard.js?v=2"></script>
    <script src="js/views/users.js?v=2"></script>
    <script src="js/views/user-details.js?v=2"></script>
    <script src="js/router.js?v=2"></script>
    <script src="app.js?v=2"></script>

</body>

</html>
